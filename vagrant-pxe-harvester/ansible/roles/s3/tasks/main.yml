---
- name: install packages
  ansible.builtin.apt:
    pkg:
      - podman
      - python3-boto3
      - python3-packaging
      - xfsprogs

- name: create filesystem for backup target
  community.general.filesystem:
    fstype: xfs
    dev: /dev/vdb

- name: create data directory
  ansible.builtin.file:
    path: /data
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: mount backup target filesystem
  ansible.posix.mount:
    path: /data
    src: /dev/vdb
    fstype: xfs
    state: mounted

- name: login to container registry
  containers.podman.podman_login:
    registry: "{{ settings['s3']['image'].split('/')[0] }}"
    username: "{{ settings['s3']['registry_username'] }}"
    password: "{{ settings['s3']['registry_password'] | default('', true) }}"
  when: settings['s3']['registry_username'] | default('', true) | length > 0
  no_log: true

- name: start minio container
  containers.podman.podman_container:
    name: minio
    image: "{{ settings['s3']['image'] }}"
    # Run as root so images with a non-root default user (e.g. AppCo, UID 1000)
    # can write to the root-owned /data
    user: root
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    ports:
      - "{{ settings['s3']['port'] }}:9000"
      - "{{ settings['s3']['console_port'] }}:9001"
    env:
      MINIO_ROOT_USER: "{{ settings['s3']['username'] }}"
      MINIO_ROOT_PASSWORD: "{{ settings['s3']['password'] }}"
    volumes:
      - "/data:/data"
    state: started

- name: create default bucket
  amazon.aws.s3_bucket:
    endpoint_url: "http://{{ settings['harvester_network_config']['dhcp_server']['ip'] }}:9000/"
    validate_certs: false
    access_key: "{{ settings['s3']['username'] }}"
    secret_key: "{{ settings['s3']['password'] }}"
    name: backups
    state: present
